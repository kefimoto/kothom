# Project-local RTK filters — commit this file with your repo.
# Filters here override user-global and built-in filters.
# Docs: https://github.com/rtk-ai/rtk#custom-filters
schema_version = 1

# Example: suppress build noise from a custom tool
# [filters.my-tool]
# description = "Compact my-tool output"
# match_command = "^my-tool\\s+build"
# strip_ansi = true
# strip_lines_matching = ["^\\s*$", "^Downloading", "^Installing"]
# max_lines = 30
# on_empty = "my-tool: ok"
[[filter]]
commands = ["bun test", "bun run test"]
description = "Collapses passing Bun tests while preserving failing lines"
patterns = [
  "(?m)^✓.*$",              # Matches passing green checks
  "(?m)^\\s*-\\s*\\d+\\s+tests\\s+passed.*$" # Summary lines
]
action = "collapse_success"

[[filter]]
commands = ["bun run next build", "bun run --bun next build", "next build", "bunx next build"]
description = "Filters out Next.js route table logs and chunk sizes on successful compilation"
patterns = [
  "(?m)^[┌└├│▲].*$",        # Matches Next.js visual build layout trees
  "(?m)^\\s*(λ|○|ƒ|●|\\s)\\s+/.*$" # Matches individual static/dynamic route status lines
]
action = "strip_lines"

[[filter]]
commands = ["vercel build", "vercel deploy"]
description = "Strips out raw telemetry data and Vercel cloud deployment path echoes"
patterns = [
  "(?m)^\\[.*\\].*Uploaded.*$", # Removes boring chunk upload progress logs
  "(?m)^\\s*Synced\\s+\\d+\\s+files.*$"
]
action = "strip_lines"

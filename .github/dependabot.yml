version: 2
updates:
  # Grouped into one weekly PR per group instead of Dependabot's default of
  # one PR per dependency per bump — the whole point of choosing Dependabot
  # over Renovate here was accepting its native (no third-party GitHub App)
  # tradeoff, and grouping is what makes that not mean a flood of individual
  # PRs to review. Major bumps are excluded from the routine groups and land
  # as their own PR, since those are the ones most likely to need an actual
  # human look rather than a rubber-stamp merge.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7.0 is the native Go port ("tsgo") and does not expose
      # the classic JS compiler API — its package.json root export is
      # version-info only, with the real API moved to "./unstable/*". Next.js
      # 16 does `require("typescript")` expecting the classic API, so `next
      # build` hard-fails on 7.x (verified 2026-07-21, see PR #27, closed).
      # REMOVE THIS once Next.js ships native-compiler support — don't leave
      # it ignored out of habit after that lands.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NOTE: deliberately no top-level `paths-ignore`.
#
# `main`'s branch protection requires a status check named exactly
# `quality-gate`, with enforce_admins on. A workflow filtered out by
# `paths-ignore` never runs, so it never posts that status, and the PR sits on
# "Expected — Waiting for status" forever with no way to merge. The job must
# always run; only its *steps* are conditional.
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Always runs, unconditionally: needs no bun/node setup, takes a
      # fraction of a second, and ubuntu-latest ships shellcheck preinstalled
      # (no extra action/install step needed). Only shell script in the repo
      # today is scripts/debug-ios-safari.sh, but this covers any future ones
      # too without needing an update here.
      - name: Shellcheck
        run: shellcheck scripts/*.sh

      # Which parts of the tree changed. Only consulted on pull_request events:
      # a push to main always runs the full gate regardless, both because main
      # deserves it and because deriving a base commit for a push needs a deeper
      # checkout than the shallow one above.
      #
      # `predicate-quantifier: every` is load-bearing, not decoration.
      #
      # By default this action ORs a filter's patterns together — a file matches
      # if it matches *at least one*. Under that default, an intuitive-looking
      # list of `'**'` plus negations is always true, because `'**'` alone
      # matches everything and the negations are evaluated as separate
      # alternatives rather than as exclusions. That was the original bug here:
      # the filter reported `code=true` on a documentation-only PR and the fast
      # path never engaged (verified against run 29841139707, where every step
      # ran on a four-file markdown change).
      #
      # With `every`, a file must satisfy *all* patterns to match, so a list of
      # pure negations means "changed files that are neither content nor
      # markdown" — which is the actual question. The filter is then true when
      # at least one such file exists.
      #
      # Keep the pattern list minimal. Under `every`, each pattern added makes
      # `code` *harder* to satisfy, which biases toward skipping checks — the
      # dangerous direction. Verify on a real PR after changing it; a wrong
      # filter here fails silently behind a green check.
      - name: Detect changed areas
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          predicate-quantifier: "every"
          filters: |
            code:
              - '!content/**'
              - '!**/*.md'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Always runs, including for content-only pull requests. This is the
      # content gate: it validates every markdown file in content/ against the
      # Zod schemas in velite.config.ts and fails on a bad or missing field,
      # naming the file and the field. Takes ~2s and needs no Next build.
      #
      # --strict is load-bearing and must not be removed: Velite's CLI declares
      # the flag with `default: false`, which overrides `strict: true` in the
      # config file, and without it a malformed file is silently dropped from
      # the output while the build still reports success and exits 0.
      - name: Validate content
        run: bunx velite --clean --strict

      # ---------------------------------------------------------------------
      # Everything below is skipped for content-only pull requests. Those are
      # still fully validated: by the content gate above, and by Vercel's own
      # build, which is a separately required status check and runs regardless.
      # ---------------------------------------------------------------------
      - name: Lint
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: bun run lint

      - name: Typecheck
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: bun run typecheck

      - name: Unit tests
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: bun run test

      # Restores Next's compilation cache between runs. Worth turning on now
      # that the route count has grown past a single page. Keyed on the lockfile
      # plus the source tree, with looser prefixes so an unrelated edit still
      # gets a warm partial cache instead of a cold build.
      - name: Cache Next.js build
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'content/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: bun run build

      - name: Cache Playwright browsers
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # No --with-deps: ubuntu-latest already ships every OS lib Chromium
      # needs (verified in job logs). Adding it back re-runs `apt-get
      # update` on every job for no-op installs, costing ~35s.
      - name: Install Playwright browsers
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: bunx playwright install chromium

      # playwright.config.ts serves the app with `bun run start` under CI,
      # reusing the build produced above instead of building the app a second
      # time inside Playwright's webServer.
      - name: E2E tests
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        run: bun run test:e2e

      # Lighthouse CI with performance budgets for older audience (WCAG AAA
      # accessibility, 75+ performance floor, 85+ best practices). Runs 3 times
      # and takes median to dampen GitHub runner variance. Config in
      # lighthouserc.json; assertions currently in warn mode to measure baselines.
      # Once measured, will promote Accessibility to error (95+ hard requirement),
      # Performance to error (75+ floor), and other categories to warn.
      #
      # Audits localhost, not production — a pull_request run must measure
      # that PR's own code, not whatever happens to be deployed. An earlier
      # version of this step pointed at kothoministries.org directly, which
      # meant every PR's Lighthouse score reflected production drift instead
      # of the PR's diff.
      #
      # The server is started by @lhci/cli itself via lighthouserc.json's
      # collect.startServerCommand ("bun run start"), not by this step —
      # treosh/lighthouse-ci-action's action.yml doesn't expose
      # startServerCommand as an input at all (confirmed: passing it here
      # produces an "Unexpected input(s)" warning, and the server never
      # starts). collect.startServerCommand is a native @lhci/cli collect
      # option read straight from the config file regardless of the Action's
      # own input list (verified in node_modules/@lhci/cli/src/collect/
      # collect.js): it spawns the command, waits for a `listen|ready`
      # stdout match, then tears the process down after collection — no
      # separate "start server" workflow step needed, and no second build
      # (reuses what `bun run start` already serves from the `Build` step
      # above).
      #
      # lighthouserc.json's collect.url entries are absolute
      # (http://localhost:3000/...), not relative — verified directly (ran
      # `lhci collect` against this config locally) that the
      # startServerCommand code path, unlike the separate staticDistDir
      # autodiscovery path, does NOT rewrite relative URLs against the
      # server's port; a relative "/" reaches Lighthouse unresolved and
      # fails with INVALID_URL.
      #
      # Temporary storage means results expire after 7 days but are
      # sufficient for performance trend monitoring; uploadArtifacts also
      # keeps a longer-lived (~90 day) copy as a GitHub Actions artifact for
      # the lighthouse-trends skill.
      - name: Lighthouse CI
        if: steps.filter.outputs.code == 'true' || github.event_name != 'pull_request'
        uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

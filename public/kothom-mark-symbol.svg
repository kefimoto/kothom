<svg xmlns="http://www.w3.org/2000/svg" viewBox="17 2 166 200">
  <title>Knights of the Higher Order Ministries brand mark (symbol - light)</title>
  <defs>
    <radialGradient id="hotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="15%" stop-color="rgba(255,255,255,0.85)" />
      <stop offset="35%" stop-color="rgba(255,255,255,0.55)" />
      <stop offset="65%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
